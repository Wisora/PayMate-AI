name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout Repo ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup Node (for linting, markdown checks) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # --- Install Dependencies ---
      - name: Install dependencies
        run: npm ci

      # --- Lint Code ---
      - name: Run ESLint
        run: npm run lint

      # --- Test Suite ---
      - name: Run tests
        run: npm test

      # --- Markdown Lint ---
      - name: Lint Markdown docs
        run: npx markdownlint-cli "docs/**/*.md" --config .markdownlint.json

      # --- Build & Live UI Accessibility Check ---
      - name: Build application
        run: npm run build

      - name: Run Pa11y Accessibility Check
        run: |
          npx serve -s dist -l 3000 &
          npx wait-on http://localhost:3000
          npx pa11y http://localhost:3000 --config .pa11yrc.cjs

      # --- k6 Performance Tests ---
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 performance suite
        run: k6 run tests/performance/basic.test.js

      # --- Commit Message Check ---
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: commitlint.config.js

      # --- Governance Binder Integrity ---
      - name: Verify governance binder structure
        run: |
          if [ ! -f docs/investor-presentations/binder-master-index-map.md ]; then
            echo "❌ Governance Master Index missing"
            exit 1
          fi
          echo "✅ Governance binder structure verified"